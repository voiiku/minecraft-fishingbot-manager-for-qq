# ============================================================================
# mc-qq-fishbot 配置文件
#
# 文件位置：可执行文件同级目录，文件名固定为 mc-qq-fishbot.conf.toml。
# 首次启动时若文件不存在，程序会按本模板生成一份并退出。
# 除兼容旧配置的可选 [fishingbot] 和 heartbeat_timeout_ms 外，其余字段均为必填。
# 字段缺失、类型错误或名称拼写错误会导致启动失败，并指出具体字段。
# 配置仅在启动时读取一次，修改后需重启进程。
# ============================================================================

# /ping 默认目标
[ping]
# 不带参数时探测的服务器地址与端口；带参数时以指令中的值为准。
default_ping_host = "your.server.address"
default_ping_port = 25565
# 探测超时，单位毫秒。
timeout_ms = 3000

# OneBot 连接
[onebot]
# QQ 协议端（如 NapCat）的正向 WebSocket 地址与端口。
host = "127.0.0.1"
port = 3001
# 协议端设置 access token 时填写，未设置则留空。
access_token = ""
# 使用 wss（TLS）时设为 true。
secure = false
# 反向代理添加路径前缀时修改。
path = "/"
# 单端点模式：所有 API 均使用 `/`，此时 path 被忽略。
all_in_one = false

# 管理员名单
# 格式：QQ号 = "名字"。名字仅用于 /show admins 展示。
# 管理员可跨账号操作机器人并使用批量指令；普通用户只能操作自己 QQ 目录下的机器人。
[admins]
"123456789" = "你的名字"

# kovi 框架
# 管理员名单由 [admins] 维护，本程序不读取 kovi.conf.toml 中的 [config]。
[kovi]
# true 时输出 debug 级别日志。环境变量 RUST_LOG 优先。
# 日志同时写入终端和部署目录的 logs/时间戳.log。
debug = false

# 机器人状态关键词
# 这些字符串用于从 FishingBot 日志判断机器人状态。更换游戏服务器或升级 jar 后需核对。
[keywords]
# 成功进入游戏服务器时的日志内容。
online = "回到xxx服"
# 掉线重连提示的前缀与后缀（此时进程仍在运行）。
reconnect_prefix = "钓鱼机器人将在"
reconnect_suffix = "秒内重新连接"
# 兼容旧配置保留；状态判断不再读取此日志字符串，以实际存活的 screen 会话为准。
stopped = ">>> 机器人进程已结束或被手动中止 <<<"
# 收到 /pause 与 /unpause 后的日志回显，仅用于确认本次指令是否生效。
pause = "已暂停钓鱼"
unpause = "已恢复钓鱼"
# 过滤日志的正则，传给 grep -v -E；匹配的行不会写入日志。
# 多个片段用 | 连接，不能包含单引号。
filter_regex = "([+][0-9.]+XP|游戏币限制重置|已处于离开状态|回来了|ECO 节能模式已)"

# 文件路径
[paths]
# 数据根目录，必须为绝对路径。
base_dir = "/fishingbots"
# FishingBot 的 jar 文件名，相对 base_dir。
# 下载地址：https://github.com/MrKinau/FishingBot/releases
jar = "FishingBot-版本号.jar"
# FishingBot 的共享配置文件，相对 base_dir；不能包含 ..，托管模式下不能经过符号链接。
game_config = "config.json"

# 游戏侧配置托管（可选）
# 存在此表时，每次启动按完整模板重新生成 paths.game_config，旧文件中的自定义键不会保留。
# 老配置不含此表时继续使用用户自己维护的 game_config，不会创建或覆盖文件。
# 生成的 misc.language 固定为 CHINESE_SIMPLIFIED，与默认中文状态关键词匹配。
[fishingbot]
server_ip = "your.server.address"
server_port = 25565
# AUTOMATIC 或 Minecraft 版本号，例如 "1.20.4"。
default_protocol = "AUTOMATIC"
auto_reconnect = true
# 重连前等待秒数。
auto_reconnect_time = 30
# 进服后执行的指令；空列表 [] 禁用进服指令。
start_text = ["/home fishing"]
# 可选值：ALL、ALL_BUT_FISH、ONLY_ENCHANTED、ONLY_BOOKS、NONE。
announce_type_console = "NONE"
announce_type_chat = "NONE"

# 运行时参数
[runtime]
# 单个 JVM 的启动参数。同时运行多个实例时应限制内存。
java_opts = "-Xms32m -Xmx128m -XX:+UseSerialGC"
# screen 会话名前缀，最终会话名为 fb_机器人名。
screen_prefix = "fb_"
# 机器人目录中保存 refreshToken 的文件名，不能含空白、斜杠、引号或 shell 元字符。
token_file = "refreshToken"
# 机器人目录中存放日志的目录名，不能含空白、斜杠、引号或 shell 元字符。
# 每次启动创建一个新的时间戳日志文件，/log 读取该文件。
# FishingBot 自身的日志位于 logs/raw/log0.log，该文件指向 /dev/null，不占用磁盘。
logs_dir = "logs"
# /log 单次返回的最大行数。
max_log_lines = 100
# 单条回复的最大字符数，超出时按行截断。
# QQ官方有限制字符上限，不要超过官方上限。
max_reply_chars = 4000

# 启动队列
# /start、/startall、/restart、/restartall 共用此队列，按批拉起。
# 微软登录按出口 IP 限流，默认每批 1 台、批间 20 秒。
# /bot login 不经过此队列。
[startup_queue]
# 每批最多拉起的机器人数。
max_batch_size = 1
# 批内相邻两台的最小间隔，单位毫秒。
bot_login_interval_ms = 1000
# 批与批之间的最小间隔，单位毫秒，从上批启动时刻起算。
# 间隔过小可能触发微软登录惩罚窗口，导致后续登录全部失败。
batch_login_interval_ms = 20000
# 等待启动队列的最大长度。
max_pending_requests = 32
# 会话复核窗口，单位毫秒；窗口结束时会话仍存活即拉起成功。
# 本次启动日志包含 online 关键词时注明已进服；否则注明日志尚未确认进服。
verify_grace_ms = 5000

# 以下时间单位均为毫秒。
[timing]
# 停止会话时等待 JVM 正常退出的时间，超时后强制终止。
batch_stop_grace_ms = 3000
# 强制终止残留会话后、复核前的缓冲时间。
batch_stop_settle_ms = 500
# 兼容旧配置保留，当前不再使用；/bot rename 要求机器人已停止且未排队。
rename_settle_ms = 300
# 心跳判定窗口，单位毫秒。协议端超过该时长未上报心跳时判定为掉线：
# 停止全部机器人并退出，由 systemd 重新拉起。
# 协议端必须开启心跳上报（NapCat 正向 WebSocket 的 heartInterval，默认 30000 毫秒）。
# 本项必须大于协议端的心跳间隔，建议设置为三倍心跳。
heartbeat_timeout_ms = 90000

# 帮助菜单
[text]
# /help 的输出
# 此处仅影响显示内容，指令是否可用由程序决定。
help = """使用前提示：
1. <机器人名> 不区分大小写，仅作为昵称。
2. 首次使用前建议固定钓鱼点，使用 /sethome fishing 保存传送点，并准备经验修补钓鱼竿。
3. 除非你完全信任本服务的提供者，否则不要登录你的游戏账号。

基础指令：
/help 显示帮助
/whoami 显示 QQ 号
/ping [地址] [端口] 检测游戏服务器
/checkserver 显示钓鱼服务器性能情况

机器人管理：
/bot add <机器人名> 添加机器人并创建目录
/bot del <机器人名> 删除机器人目录
/bot rename <旧名> <新名> 重命名机器人（须已停止且未排队，不会自动停止）
/bot login <机器人名> 仅私聊；通过微软设备码登录并保存 Token，成功后保留当前会话继续运行，不重新排队
/token <机器人名> <Token> 仅私聊；手动写入 Token（当/bot login 失败时的备用方式）
/log <机器人名> [行数] 仅私聊；查看最新日志（默认 100 行，最多 100 行）

运行控制：
/start <机器人名> 启动机器人（进入启动队列）
/stop <机器人名> 停止机器人；排队中的会取消排队
/restart <机器人名> 仅重启正在运行的机器人
/command <机器人名> <指令> 向机器人所在游戏服发送指令；以 / 开头为游戏指令，否则为聊天
/pause <机器人名> 暂停钓鱼，保持在线
/unpause <机器人名> 恢复钓鱼

查询：
/show botconfig 显示共享的游戏配置
/show mybots 显示自己的机器人及 Token 状态
/show allbots 显示全部机器人及 Token 状态
/show admins 显示管理员名单
/show status 显示全部正在运行机器人的状态与排队的机器人

批量指令（仅管理员）：
/startall 将所有已配置 Token 且未运行的机器人加入启动队列
/stopall 清空启动队列并停止全部机器人
/restartall 重启全部运行中的机器人
/commandall <指令> 向全部运行中的机器人发送指令"""
