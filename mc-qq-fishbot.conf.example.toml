# ============================================================================
# mc-qq-fishbot 配置文件
# 本文件是"首次启动自动生成的模板配置文件"
# 位置：必须与可执行文件放在同一目录，不可改名。
# 用法：直接运行mc-qq-fishbot即可，没有此文件时，程序会按模板生成一份，提示你修改并退出。
#
# 设计约定：
#   * 所有字段都必须填写。缺字段、写错类型、名字拼错都会
#     在启动时报错并指出具体字段，这是刻意的——免得进程跑起来了、行为却不对。
#     唯一的例外是 [timing] 里的 heartbeat_timeout_ms：它有默认值，好让旧配置不改一行也能升级。
#   * 路径规则（写错会在启动时报错）：
#     paths.base_dir 必须写绝对路径（例如 /fishingbots）；
#     paths.jar 与 paths.game_config 必须写相对路径（相对 base_dir），不要写绝对路径。
#   * 管理员名单就在下面的 [admins] 里填（"QQ号" = "名字"），本程序不读 kovi.conf.toml。
# ============================================================================

# ------------------------------ /ping 默认目标 ------------------------------
[ping]
# `/ping` 不带参数时要探测的服务器，换成游戏服务器的地址与端口（带参数时以聊天里给的为准）。
default_ping_host = "your.server.address"
default_ping_port = 25565
# 探测时的连接超时（毫秒）。
timeout_ms = 3000

# ------------------------------ OneBot 连接信息 ------------------------------
# 你的 QQ 协议端（例如 NapCat）的地址与 token；kovi 自己的 kovi.conf.toml 不用管，
# 那是它自己写状态用的文件（本项目不读不写）。
[onebot]
host = "127.0.0.1"
port = 3001
# 服务端设了 access token 就填在这里，没有就留空。
access_token = ""
# 用 wss（TLS）时改为 true。
secure = false
# 反向代理加了路径前缀时才需要改。
path = "/"
# 单端点模式：所有 API 都走 `/`，此时 path 会被忽略。
all_in_one = false

# ------------------------------ 管理员名单 ------------------------------
# 格式：QQ号 = "名字"（名字只用于 /show admins 展示，随便写）
# 管理员可以跨账号操作任意机器人，并使用 /startall、/stopall、/restartall、/commandall；
# 普通用户只能操作自己 QQ 目录下的机器人。
[admins]
# "123456789" = "你的名字"

# ------------------------------ kovi 框架 ------------------------------
# 管理员名单由上面的 [admins] 维护，不再使用 kovi.conf.toml 里的 [config]（那边只需要 [server]）。
[kovi]
# true 时打印 debug 级别日志（相当于原来的 [config].debug）。
# 环境变量 RUST_LOG 优先；两者都只认一个级别词（off/error/warn/info/debug/trace）。
# 日志同时写终端与本程序同级目录下的 logs/年-月-日-时-分-秒.log（本进程日志）。
debug = false

# ------------------------------ 日志关键词 ------------------------------
# 这些字符串用来从 FishingBot 的日志中判断机器人状态（对应/status 命令）。
# 游戏服相关插件有变化、或升级 FishingBot 的 jar 之后，先手动确定真实输出，
# 再回来核对这几项，否则状态会被错误判断。
[keywords]
# 成功进入游戏服务器时打印的内容（通常是"回到 xxx 服"这样的提示）。
online = "回到xxx服"
# JVM 中对掉线重连提示的前缀与后缀（此时进程仍在运行），日志里形如：" 钓鱼机器人将在 30 秒内重新连接 "
# 一般不用改
reconnect_prefix = "钓鱼机器人将在"
reconnect_suffix = "秒内重新连接"
# 进程结束或被手动中止时打印的内容。
# 一般不用改
stopped = ">>> 机器人进程已结束或被手动中止 <<<"
# 收到 /pause 与 /unpause 之后机器人JAR返回的内容，用于辨别"暂停中/钓鱼中"的钓鱼状态。
# 一般不用改
pause = "已暂停钓鱼"
unpause = "已恢复钓鱼"
# 过滤垃圾游戏信息用的正则（会传给 grep -v -E：命中的行被丢弃，不写进日志）。
# 多个片段用 | 连接；不能写单引号。
filter_regex = "([+][0-9.]+XP|游戏币限制重置|已处于离开状态|回来了|ECO 节能模式已)"

# ------------------------------ 文件路径 ------------------------------
[paths]
# 程序根目录：机器人目录、jar 与游戏配置的公共父目录。必须写绝对路径。
base_dir = "/fishingbots"
# FishingBot 的 jar 的文件名。必须写相对路径（相对 base_dir）；
# 升级版本时改这里即可，不需要改代码。下载地址：https://github.com/MrKinau/FishingBot
jar = "FishingBot-2.13.15.jar"
# 所有机器人共用的钓鱼配置的文件名。必须写相对路径（相对 base_dir）。
# 由 FishingBot 首次运行时会自己创建，一般默认生成的配置就够用，你可以修改其中的配置。
game_config = "config.json"

# ------------------------------ 运行时参数 ------------------------------
[runtime]
# 单个机器人 JVM 的启动参数；同时跑很多实例时内存配额要压低。
java_opts = "-Xms32m -Xmx128m -XX:+UseSerialGC"
# screen 会话名前缀，最终会话名形如 fb_机器人名。
screen_prefix = "fb_"
# 机器人目录下保存 refreshToken 的文件名（/token 命令写入的就是它，位置如/fishingbots/bots/QQ号/机器人名称/refreshToken）。
token_file = "refreshToken"
# 机器人目录下存放日志的文件夹名（位置如 /fishingbots/bots/QQ号/机器人名称/logs）。
# 每次启动都写一个新文件（logs/年-月-日-时-分-秒.log），不覆盖历史日志；文件里只有
# 「过滤后的内容」（/log 命令读的就是它，命中 filter_regex 的刷屏行在写盘前就被丢掉）。
# FishingBot 自己也会写日志（logs/raw/log0.log），但那个文件是指向 /dev/null 的符号链接，
# 内容不会落到磁盘上，所以一共只有一份日志。
logs_dir = "logs"
# 单次 /log 命令最多返回多少行，避免一次查询太多造成卡顿。
max_log_lines = 100
# 单条回复的最大字符数：超过就按行截断，并在末尾注明省略了多少行。
# 协议端对单条消息有长度限制（超长会直接发送失败，你那边看起来"什么都没发生"），
# 所以 /show allbots、/startall 这类明细较多的回复会按这一项收口。
max_reply_chars = 1500

# ------------------------------ 等待时间 ------------------------------
# 以下全部为毫秒。
[timing]
# 单个机器人（/start、/restart）拉起会话后，等多久复核会话是否真的存在。
single_settle_ms = 300
# 批量拉起时相邻两次之间的间隔，用于摊平 JVM 启动时的内存峰值。
batch_stagger_ms = 300
# 批量启动/重启全部发完后，留给 JVM 初始化的时间。
# 内存紧张的机器可以调大，代价是 /startall 响应变慢。
batch_settle_ms = 25000
# 停止会话时等待 JVM 优雅退出的时间，超时才强杀。
batch_stop_grace_ms = 3000
# 强杀残留会话后、复核前的小缓冲，确保旧会话彻底注销。
batch_stop_settle_ms = 500
# /bot rename 停掉正在运行的机器人后、真正改名前的缓冲：给旧会话一点时间释放文件句柄
# （否则可能出现"目录改名了、句柄还指着旧路径"）。
rename_settle_ms = 300
# 心跳判定窗口，单位毫秒：协议端上报的 OneBot 心跳（meta_event.heartbeat）超过这么久没来，
# 就按掉线处理 —— 停止全部机器人并退出，由 systemd 重新拉起（= 重连）。
#
# 这是"WebSocket 静默死掉"（对端不再发东西、也没有断开事件）唯一的兜底信号，
# 因此**协议端必须开启心跳上报**（NapCat：正向 WebSocket 的 heartInterval，默认 30000 毫秒）；
# 启动后一直收不到心跳同样会收工退出，并在日志里提示怎么开启。
#
# 这一项必须大于协议端的心跳间隔：协议端间隔更大时，心跳还没到就会被判成掉线
# （例如协议端设成 60000 毫秒，这里就要大于 60000）。
# 本项也是**唯一带默认值的配置项**（默认 30000，与 NapCat 的默认间隔一致）：旧配置文件不写它
# 也能直接升级运行；但显式写 0 仍然会在启动时报错。
heartbeat_timeout_ms = 30000

# ------------------------------ 帮助菜单 ------------------------------
[text]
# /help 命令的完整输出（多行字符串，三个引号包裹），改文案不需要重新编译。
# 注意：这里只影响"显示"，指令能不能被识别由程序决定，请保持与实际支持的指令一致。
help = """写在前面的提示1：<机器人名>不区分大小写，相当于一个昵称，不检测真实性，可以不对应真实的游戏角色名，在文件上统一以小写形式保存。
写在前面的提示2：建议第一次使用前，找到一个专属钓鱼位，并/sethome fishing保存传送点，保证背包里有经验修补钓鱼杆。
写在前面的提示3：管理员批量操作启动/重启时，由于峰值超过服务器内存容量，会导致一部分进程被杀，所以不一定成功全部启动，运行一段时间后内存会逐渐优化。
写在前面的提示4：权限基于QQ号验证，每个人只能操作自己创建的机器人，管理员有权限操作全部机器人。

/help 展示此帮助菜单
/status 检查全部正在运行的机器人状态
/ping [地址（可选）] [端口（可选）] ,检查游戏服务器状态
/checkserver 检查钓鱼服务器信息

/bot add <机器人名> 添加机器人并创建目录（名字只允许字母、数字、下划线与连字符，非法会报错）
/bot del <机器人名> 删除机器人目录
/bot rename <旧机器人名> <新机器人名> 更名机器人（运行中的会先停止，但不会自动重启）
/token <机器人名> <token字符串> #此命令仅限添加qq机器人好友后私聊使用#
/log <机器人名> <行数> 查看指定机器人最新日志中的最新若干行（最多100行）#此命令仅限私聊使用#
关于Token字符串:钓鱼机器人基于 https://github.com/MrKinau/FishingBot/tree/dev/26.2 ，第一次手动运行 FishingBot-XXX.jar 时会验证登录，登录成功后会在同目录下生成一个名为refreshToken的文件，这个token就是机器人的登录凭据，请用记事本打开这个文件，并把里面文本全选复制粘贴，私聊发送给机器人。

/start <机器人名> 启动指定机器人
/stop <机器人名> 停止指定机器人
/restart <机器人名> 重启指定机器人
/command <机器人名> <指令内容> 向指定机器人发送指令，此指令将会在游戏服务器中被执行，需要带斜杠，不带斜杠就是聊天
/pause <机器人名> 暂停钓鱼，但不下线
/unpause <机器人名> 取消暂停钓鱼

/show config 查看目前的全部钓鱼机器人配置
/show mybots 查看自己添加的全部机器人以及token是否存在（不验证真实性）
/show allbots 查看全部机器人以及token是否存在（不验证真实性）
/show admins 查看管理员列表及对应QQ号

/startall 管理员可用，启动全部有token的机器人（不一定能全部成功启动！）
/stopall 管理员可用，停止全部机器人
/restartall 管理员可用，重启全部正在运行的机器人（不一定能全部成功重启！）
/commandall <要发送的指令字符串> 管理员可用，向全部正在运行的机器人发送指令"""
