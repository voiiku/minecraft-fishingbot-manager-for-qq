[package]
name = "mc-qq-fishbot"
version = "0.5.0"
edition = "2024"
description = "基于 Kovi 与 FishingBot 的 Minecraft 自动钓鱼 QQ 机器人"
license = "MIT"
publish = false

[lib]
name = "mc_qq_fishbot"
path = "src/lib.rs"

[[bin]]
name = "mc-qq-fishbot"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
craftping = { version = "0.7.0", features = ["async-tokio"] }
kovi = "0.13.5"
kovi-onebot = "0.13.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
